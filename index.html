<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <title>Bernardez Fragancias · Catálogo</title>

    <link rel="stylesheet" href="./css/estilos.css">
</head>

<body>

    <div class="w">

        <header>

            <div class="k">
                Catálogo 2026 · Perfumes
            </div>

            <h1>
                Bernardez
                <br>
                Fragancias
            </h1>

            <p>
                Fragancias árabes
            </p>

        </header>


        <div class="buscador">
            <input
                type="search"
                id="buscar"
                placeholder="Buscar perfume o marca…"
                aria-label="Buscar perfume o marca"
                autocomplete="off"
            >
        </div>


        <nav class="filtros" aria-label="Filtrar perfumes">

            <button
                type="button"
                class="filtro activo"
                data-filtro="todos"
            >
                Todos
            </button>

            <button
                type="button"
                class="filtro"
                data-filtro="unisex"
            >
                Unisex
            </button>

            <button
                type="button"
                class="filtro"
                data-filtro="masculinos"
            >
                Hombre
            </button>

            <button
                type="button"
                class="filtro"
                data-filtro="femeninos"
            >
                Mujer
            </button>

        </nav>


        <main id="catalogo"></main>


        <section class="info">

            <div>

                <h2>
                    Formas de pago
                </h2>

                <ul>
                    <li>Efectivo</li>
                    <li>Transferencia</li>
                    <li>QR</li>
                    <li>Débito</li>
                </ul>

            </div>


            <div>

                <h2>
                    Envíos y retiros
                </h2>

                <ul>
                    <li>Envíos sin cargo, según la zona</li>
                    <li>Retiros a domicilio</li>
                </ul>

            </div>

        </section>


        <footer>

            <a
                href="https://wa.me/543515597015"
                target="_blank"
                rel="noopener"
            >
                WhatsApp +54 351 559-7015
            </a>

            <br>

            <a
                href="https://instagram.com/Lautibernardez"
                target="_blank"
                rel="noopener"
            >
                Instagram @Lautibernardez
            </a>

            <br>

            <a
                class="wa"
                href="https://wa.me/543515597015?text=Hola!%20Quiero%20hacer%20una%20consulta"
                target="_blank"
                rel="noopener"
            >
                Escribinos por WhatsApp
            </a>

        </footer>

    </div>


    <script src="./js/productos.js"></script>
    <script src="./js/script.js"></script>

</body>

</html>
